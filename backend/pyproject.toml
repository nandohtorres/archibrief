[project]
name = "archibrief-backend"
version = "0.1.0"
description = "ArchiBrief backend — Lambda functions, RuleEngine, LangGraph nodes"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "boto3>=1.34",
    "langgraph>=0.2",
    "python-hcl2>=6.0",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[dynamodb,s3]>=5.0",
    "reportlab>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = [".."]
