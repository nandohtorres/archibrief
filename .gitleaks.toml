# ArchiBrief secret-scanning config, wired into .github/workflows/ci.yml's
# secrets-scan job. Denylist per ADR-0015/0042: *.tfstate*, saved plan
# files, .terraform/, crash logs, local overrides, backend config,
# uploaded test/fixture repositories.

title = "archibrief-gitleaks"

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.terraform/''',
  '''tests/.*/fixtures/.*''',
]

[[rules]]
id = "aws-account-id-placeholder"
description = "Flag non-placeholder AWS account IDs committed in tfvars/tf files"
# gitleaks compiles rule regexes with Go's `regexp` package (RE2), which
# has no lookahead/lookbehind, so the placeholder can't be excluded in the
# regex itself. The rule matches any 12-digit aws_account_id assignment,
# and the placeholder is exempted through the per-rule allowlist below.
regex = '''aws_account_id\s*=\s*"\d{12}"'''
tags = ["aws", "account-id"]

  [rules.allowlist]
  regexes = ['''"000000000000"''']

[[rules]]
id = "aws-account-id-in-arn"
description = "Flag any non-placeholder AWS account ID embedded in an ARN (.tf/.json/.md, code comments, etc.) - the rule above only catches an `aws_account_id = \"...\"` assignment, not an ID inside an ARN string, which is the more likely shape of a leak"
# Generic on purpose: matching a real account ID as a literal would put
# that ID in the repo itself. Never name a real account ID in this file;
# match the ARN shape and allowlist placeholders.
regex = '''arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:\d{12}:'''
tags = ["aws", "account-id"]

  [rules.allowlist]
  regexes = ['''(123456789012|000000000000)''']

[[rules]]
id = "terraform-state-file"
description = "Terraform state or plan files should never be committed"
path = '''(\.tfstate(\.backup)?|\.tfplan)$'''
tags = ["terraform", "state"]
