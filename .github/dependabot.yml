# Weekly dependency updates. Minor and patch bumps are grouped per ecosystem
# so each week brings a few pull requests rather than dozens.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/environments/dev
      - /infra/modules/*
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]
