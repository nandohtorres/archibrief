name: live-smoke

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # No AWS credentials, npm install, browser or paid endpoints.
      - name: Read-only production smoke
        id: smoke
        shell: bash
        run: node scripts/smoke_live.mjs https://archibrief.dev https://api.archibrief.dev | tee "$RUNNER_TEMP/live-smoke.log"
      - name: Smoke summary
        if: always()
        shell: bash
        env:
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          {
            printf '## Daily live smoke: %s\n\n' "$SMOKE_RESULT"
            if [[ -f "$RUNNER_TEMP/live-smoke.log" ]]; then
              echo '```text'
              cat "$RUNNER_TEMP/live-smoke.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
