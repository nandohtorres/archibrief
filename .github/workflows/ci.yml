# ArchiBrief CI — advisory (not yet gating merges; Phase 7 tightens this
# to required/blocking status checks per Work-Project-Build-Plan.md).
#
# Third-party actions are pinned to full commit SHAs (tag in the trailing
# comment) so a moved or compromised tag cannot change what CI runs.
name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # backend/ isn't installed as a package — call sites import
      # "backend.xxx" from the repo root (see backend/pyproject.toml's
      # pythonpath = [".."] pytest setting), so CI installs dependencies
      # directly rather than `pip install -e backend`.
      - run: pip install pydantic boto3 langgraph python-hcl2 ruff pytest pytest-cov "moto[dynamodb,s3]"
      - run: ruff format --check backend
      - run: ruff check backend
      - run: pytest --cov=backend --cov-report=term-missing
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: has_app
        run: |
          if [ -f frontend/package.json ] && [ -n "$(find frontend/app -type f 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.has_app.outputs.present == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend
      - run: npm run lint
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend
      - run: npx prettier --check .
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend
      - run: npm run test
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Builds and serves both static-export variants itself (see
      # frontend/e2e/dev-server.mjs) - no AWS credentials involved, every
      # network call the "live" critical path makes is intercepted and
      # answered locally (frontend/e2e/live-admin-path.spec.ts).
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.9"
      - run: terraform fmt -check -recursive infra
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      - run: tflint --recursive --chdir=infra

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
