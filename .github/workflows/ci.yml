# ArchiBrief CI. All five jobs are required status checks for merging
# into master.
#
# Third-party actions are pinned to full commit SHAs (tag in the trailing
# comment) so a moved or compromised tag cannot change what CI runs.
name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # backend/ isn't installed as a package: call sites import
      # "backend.xxx" from the repo root (see backend/pyproject.toml's
      # pythonpath = [".."] pytest setting), so CI installs dependencies
      # directly rather than `pip install -e backend`.
      # The runtime dependencies from backend/pyproject.toml (bs4 and pypdf
      # for the corpus pipeline), plus reportlab, which only the PDF tests
      # use to build their sample files.
      - run: pip install -r backend/dev-requirements.lock.txt
      # Trivy (ADR-0048), the same pinned, checksum-verified release the
      # Lambda layer ships (scripts/build_trivy_layer.py; a test keeps the
      # two in sync). TRIVY_PATH makes the trap suite run its Trivy mode.
      - name: Install Trivy
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz"             https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          echo "TRIVY_PATH=$RUNNER_TEMP/trivy" >> "$GITHUB_ENV"
      # ArchiBrief's own infrastructure: fail on any HIGH/CRITICAL finding
      # not accepted, with a reason, in .trivyignore.
      - name: Trivy scan of infra/
        run: >
          "$TRIVY_PATH" config --skip-check-update --skip-version-check
          --disable-telemetry --severity HIGH,CRITICAL --ignorefile .trivyignore
          --exit-code 1 infra
      - run: ruff format --check backend
      - run: ruff check backend
      # Documented adversarial coverage gaps fail on purpose; see
      # tests/backend/adversarial/FIX_REPORT.md.
      - run: pytest -m "not coverage_gap" --cov=backend --cov-report=term-missing
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: has_app
        run: |
          if [ -f frontend/package.json ] && [ -n "$(find frontend/app -type f 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has_app.outputs.present == 'true'
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend
      - run: npm run lint
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend
      - run: npm run typecheck
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend
      - run: npx prettier --check .
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend
      - run: npm run test
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend
      - run: npm run test:tooling
        if: steps.has_app.outputs.present == 'true'
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Builds and serves both static-export variants itself (see
      # frontend/e2e/dev-server.mjs) - no AWS credentials involved, every
      # network call the "live" critical path makes is intercepted and
      # answered locally (frontend/e2e/live-admin-path.spec.ts).
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-build-logs/
          retention-days: 7

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.9"
      - run: terraform fmt -check -recursive infra
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --recursive --chdir=infra

  secrets-scan:
    runs-on: ubuntu-latest
    # gitleaks-action needs the token to list a pull request's commits.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PR comments: they'd need write access and would quote findings.
          GITLEAKS_ENABLE_COMMENTS: "false"
